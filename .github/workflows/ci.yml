name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks

    runs-on: ubuntu-latest

    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine

        env:
          POSTGRES_USER: cowork
          POSTGRES_PASSWORD: cowork_pass
          POSTGRES_DB: cowork_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U cowork -d cowork_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cowork:cowork_pass@127.0.0.1:5432/cowork_test

      APP_URL: http://localhost:3000

      AUTH_SECRET: ci-only-auth-secret-that-is-at-least-32-characters-long

      RESEND_API_KEY: ""

      EMAIL_FROM: "CoWork <noreply@example.com>"

      AUTH_GOOGLE_ID: ""

      AUTH_GOOGLE_SECRET: ""

      STRIPE_SECRET_KEY: ""

      STRIPE_WEBHOOK_SECRET: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check database connection
        run: npm run db:check

      - name: Run database migrations
        run: npm run db:migrate

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency security audit
        run: npm run security:audit

      - name: Production build
        run: npm run build